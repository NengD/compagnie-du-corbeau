<title>Compagnie du Corbeau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout : en-tête de compagnie, puis camp (onglets) ou champ de bataille (plateau hexagonal + panneau latéral). Monde unique, sombre : cuir, terre, fer et sang. */
:root{
  --bg:#1c1915; --panel:#26211b; --panel2:#30291f; --line:#4a3f31;
  --ink:#ece1c9; --mute:#a8997e; --blood:#b03a2e; --gold:#cfa851; --steel:#86a3c0; --good:#8ea25f;
  --display:'Pirata One',Georgia,'Times New Roman',serif;
  --body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(207,168,81,.07),transparent 55%),radial-gradient(ellipse at 100% 110%,rgba(176,58,46,.07),transparent 50%);background-attachment:fixed}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.top h1{font-size:34px;line-height:1;color:var(--ink)}
.top h1 span{color:var(--blood)}
.res{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.res b{color:var(--gold);font-weight:800}
.res .lbl{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-right:5px}
.top .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:3px;font:700 14px var(--body);cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:focus-visible,.tab:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.pri{background:#6a231c;border-color:#8f3328}
.btn.pri:hover:not(:disabled){background:#7c2a21;border-color:var(--gold)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mute);font:400 22px var(--display);padding:4px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blood)}
.news{border-left:3px solid var(--gold);background:var(--panel);padding:8px 12px;margin-bottom:14px;display:grid;gap:3px;font-size:14px}
.news div:not(:first-child){color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.card h3{font-size:22px;line-height:1.1}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-variant-numeric:tabular-nums}
.stat{background:var(--panel2);padding:3px 5px;border-radius:2px;display:grid}
.stat span{font-size:9.5px;overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.stat b{font-size:15px}
.bars{display:grid;gap:3px}
.bar{display:grid;grid-template-columns:58px 1fr 62px;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums}
.bar .t{height:8px;background:#15120f;border-radius:1px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar .v{text-align:right;color:var(--mute)}
.c-hp{background:var(--blood)} .c-ah{background:#c9c2b2} .c-ab{background:var(--steel)} .c-ft{background:#5d7f8a} .c-xp{background:var(--gold)}
.gear{display:grid;gap:2px;font-size:13px}
.gear div{display:flex;justify-content:space-between;gap:8px;min-width:0}.gear div>span+*,.gear div{overflow-wrap:anywhere}
.gear span{color:var(--mute)}
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);display:inline-block}
.pips i.on{background:var(--gold)}
.pips i.pre{background:rgba(207,168,81,.3)}
.chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:2px 6px;border-radius:2px;background:var(--panel2);border:1px solid var(--line)}
.m0{color:#ff7a68;border-color:#8f3328}.m1{color:#e89a55}.m2{color:#dcc56a}.m3{color:var(--mute)}.m4{color:#a9c879;border-color:#56693a}
.skull{display:inline-flex;gap:3px}
.skull i{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--blood);display:inline-block}
.skull i.on{background:var(--blood)}
.pay{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
details.help{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 12px;margin-bottom:14px}
details.help summary{cursor:pointer;font-weight:700;color:var(--gold)}
details.help ul{margin:8px 0 2px;padding-left:18px;display:grid;gap:3px;max-width:75ch}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;display:grid;gap:4px}
.item .nm{font-weight:800}
.item .row{justify-content:space-between}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:6px 8px;font:500 14px var(--body);border-radius:3px;max-width:100%}
.section-h{font-family:var(--display);font-size:24px;margin:14px 0 8px}
.memorial{color:var(--mute);font-size:13px;margin-top:18px;border-top:1px solid var(--line);padding-top:10px}

/* Bataille */
.battle{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:920px){.battle{grid-template-columns:minmax(0,1fr)}}
.board{background:#23241a;border:1px solid var(--line);border-radius:4px;padding:6px;min-width:0}
.board svg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.bhead h2{font-size:26px}
.side{display:grid;gap:10px;min-width:0}
.queue{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.qt{flex:0 0 auto;width:34px;height:34px;border-radius:3px;overflow:hidden;border:2px solid}
.qt .pt{width:100%;height:100%;border:0;border-radius:0}
.qt.p{border-color:#8fb0d0}.qt.b{border-color:#d9705f}.qt.g{border-color:#a99bb5}
.qt.now{outline:2px solid var(--gold);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-height:240px;overflow-y:auto;font-size:13px;display:grid;gap:2px}
.log .hit{color:var(--ink)}.log .miss{color:var(--mute)}.log .death{color:#ff8a78;font-weight:700}.log .mor{color:#dcc56a}.log .sys{color:var(--gold);font-family:var(--display);font-size:16px}
.hint{font-size:13px;color:var(--mute)}
.odds{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:14px}
.odds b{color:var(--gold);font-size:20px}
.overlay{position:fixed;inset:0;background:rgba(10,8,6,.72);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:4px;padding:18px;max-width:460px;width:100%;display:grid;gap:10px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:34px}
.modal h2.win{color:var(--gold)}.modal h2.lose{color:var(--blood)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choice{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px;border-radius:3px;cursor:pointer;text-align:left;font:500 14px var(--body);display:flex;justify-content:space-between}
.choice[aria-pressed="true"]{border-color:var(--gold);background:#3d3322}
.choice b{color:var(--gold)}

/* SVG */
.hx{stroke:rgba(20,22,10,.4);stroke-width:1}
.g0{fill:#606a3e}.g1{fill:#68723f}.g2{fill:#58623a}
.tree{fill:#2c3b22;stroke:#1f2a18;stroke-width:1}
.rock{fill:#77705f;stroke:#4b463b;stroke-width:1}
.deploy-p{fill:rgba(134,163,192,.07)}
.hi{pointer-events:none}
.hi-reach{fill:rgba(207,168,81,.15);stroke:rgba(207,168,81,.5);stroke-width:1}
.hi-path{fill:rgba(207,168,81,.42)}
.hi-cur{fill:none;stroke:var(--gold);stroke-width:2.5}
.hi-tg{fill:rgba(176,58,46,.28);stroke:#e0705f;stroke-width:1.5}
.cost{font:800 11px var(--body);fill:#1c1915;text-anchor:middle;pointer-events:none}
.tk{cursor:pointer}
.tk-p{fill:#2d4866;stroke:#a8c2db}.tk-b{fill:#6a2a22;stroke:#e09a86}.tk-g{fill:#4a3d55;stroke:#bba7cb}
.tk circle.body{stroke-width:2}
.glyph{fill:none;stroke:#efe6d2;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glyph .fl{fill:#efe6d2}
.ring{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:6 4;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.base-p{fill:none;stroke:#8fb0d0;stroke-width:1.4;opacity:.75}.base-e{fill:none;stroke:#d9705f;stroke-width:1.4;opacity:.75}
.pt{width:54px;height:54px;border:1px solid var(--line);border-radius:3px;flex:0 0 auto;background:#2a2620;display:block}
.pt.sm{width:32px;height:32px}
.who{display:flex;gap:10px;align-items:center;min-width:0}.who>div{min-width:0;flex:1;display:grid;gap:2px}
.bbg{fill:#120f0c}.bh{fill:#cfc8b8}.bb{fill:#86a3c0}.bp{fill:#c4483a}
.mp0{fill:#ff6b57}.mp1{fill:#e89a55}.mp2{fill:#dcc56a}.mp3{fill:#8a8070}.mp4{fill:#a9c879}
.flee{opacity:.65}
.pct{font:800 11px var(--body);fill:#fff;text-anchor:middle;pointer-events:none}
.pctbg{fill:#8f3328;stroke:#f0a090;stroke-width:1}
.corpse{stroke:#2a1a14;stroke-width:3;stroke-linecap:round;opacity:.55}
.flt{font:800 15px var(--body);text-anchor:middle;paint-order:stroke;stroke:#120f0c;stroke-width:3px;animation:rise 1.2s ease-out forwards;pointer-events:none}
.flt.hp{fill:#ff7a68}.flt.ar{fill:#cfd9e4}.flt.miss{fill:#ddd2bb}.flt.big{font-size:18px}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-28px);opacity:0}}
.slash{stroke:#f3e3b5;stroke-width:3;stroke-linecap:round;animation:fade .35s forwards;pointer-events:none}
.arrow{stroke:#d9c79a;stroke-width:1.6;stroke-dasharray:4 3;animation:fade .45s forwards;pointer-events:none}
@keyframes fade{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.qt{animation:none}.flt{animation-duration:.01s}}
.over-card{text-align:center;max-width:560px;margin:40px auto;display:grid;gap:12px}
.over-card h2{font-size:48px;color:var(--blood)}
</style>

const STATN={hpMax:'PV',fatMax:'Endurance',res:'Détermination',ini:'Initiative',mSk:'Att. mêlée',rSk:'Att. distance',mDef:'Déf. mêlée',rDef:'Déf. distance'};
const PROMO={hpMax:[2,4],fatMax:[2,4],res:[2,4],ini:[3,5],mSk:[1,3],rSk:[1,3],mDef:[1,3],rDef:[2,4]};
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const HS=30,SQ=Math.sqrt(3);
const KEY='corbeau-v1';

let S=null, UID=1, lastPtr='mouse';

/* ---------- Unités ---------- */
function randName(){
  const taken=new Set((S?S.roster:[]).map(m=>m.name));
  for(let i=0;i<30;i++){const n=pick(FIRST)+(Math.random()<.65?' '+pick(NICK):'');if(!taken.has(n))return n;}
  return pick(FIRST)+' '+R(2,9);
}
function mkUnit(t,side,name){
  const head=pick(t.head),body=pick(t.body),w=pick(t.w);
  const u={id:UID++,name,bg:t.n,side,hpMax:R(...t.hp),fatMax:R(...t.fat),res:R(...t.res),mSk:R(...t.mSk),rSk:R(...t.rSk),mDef:R(...t.mDef),rDef:R(...t.rDef),ini:R(...t.ini),
    weapon:w,shield:!!(WPN[w].h1&&Math.random()<t.sh),head,body,xp:0,lvl:1,kills:0,pending:0};
  u.hp=u.hpMax;u.armH=HEAD[head].a;u.armB=BODY[body].a;return u;
}
function mkMerc(k){const u=mkUnit(BG[k],'p',randName());u.wage=BG[k].wage;return u;}
function mkFoe(k){const t=FOE[k];const u=mkUnit(t,'e',t.n);u.fac=t.fac;u.xpv=t.xp;u.leader=!!t.leader;return u;}
const weight=u=>HEAD[u.head].w+BODY[u.body].w+(u.shield?SHIELD.w:0);
const fatMaxEff=u=>u.fatMax-weight(u);
const iniEff=u=>u.ini-weight(u)-(u.fat||0);
const moveFat=u=>2+Math.floor(weight(u)/10);
const wages=()=>S.roster.reduce((s,m)=>s+m.wage,0);
const fac=u=>u.side==='p'?'p':u.fac;

function genRecruits(){
  const pool=[];Object.entries(BG).forEach(([k,b])=>{for(let i=0;i<b.wt;i++)pool.push(k)});
  S.recruits=[];for(let i=0;i<4;i++){const k=pick(pool);const u=mkMerc(k);S.recruits.push({u,price:Math.round(BG[k].price*(.85+Math.random()*.3)/5)*5});}
}
function genContracts(){
  S.contracts=[];
  const base=Math.min(3,1+Math.floor(S.renown/160));
  for(let i=0;i<3;i++){
    const type=pick(['b','b','g']);const d=clamp(base+pick([-1,0,0,1]),1,3);const town=pick(TOWNS);
    let foes,title,desc;
    if(type==='b'){
      foes=[[],['brigand','brigand','brigand','archer'],['brigand','brigand','brigand','archer','archer','balafre'],['brigand','brigand','brigand','archer','archer','balafre','balafre','chef']][d];
      title='Brigands près de '+town;
      desc=pick(['Des brigands rançonnent la route du '+pick(['moulin','marché','gué','col'])+'.','Une bande a pillé deux fermes et campe dans les bois.','Les péages illégaux étranglent le commerce. Qu\'on en finisse.']);
    }else{
      foes=[[],['goule','goule','goule'],['goule','goule','goule','goule','vorace'],['goule','goule','goule','goule','goule','vorace','vorace']][d];
      title='Goules à '+town;
      desc=pick(['On déterre les morts au cimetière. Les villageois n\'osent plus sortir.','Des bêtes difformes rôdent autour du charnier depuis la dernière peste.','Un berger a été dévoré. On a vu des silhouettes voûtées dans la brume.']);
    }
    const days=R(1,3);
    S.contracts.push({type,d,foes,title,desc,days,employer:pick(EMPL)+' de '+town,pay:d*320+R(0,30)*5+(type==='g'?d*60:0)+days*20});
  }
}

/* ---------- Partie ---------- */
function newGame(){
  UID=1;
  S={gold:800,day:1,renown:0,roster:[],recruits:[],contracts:[],battle:null,news:['La Compagnie du Corbeau est fondée. Cinq lames, peu de couronnes, beaucoup de routes.'],fallen:[],tab:'company',mSel:null,promo:null,confirm:null,over:false};
  ['milicien','bucheron','braconnier','fermier','deserteur'].forEach(k=>S.roster.push(mkMerc(k)));
  genRecruits();genContracts();save();render();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,UID}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.S&&d.S.roster){S=d.S;UID=d.UID;return true}}catch(e){}return false}
function news(...l){S.news=[...l,...S.news].slice(0,4);}
function levelCheck(m){while(m.lvl<11&&m.xp>=XPT[m.lvl+1]){m.lvl++;m.pending++;}}

/* ---------- Hexagones ---------- */
const hk=(q,r)=>q+','+r;
const hdist=(a,b)=>(Math.abs(a.q-b.q)+Math.abs(a.q+a.r-b.q-b.r)+Math.abs(a.r-b.r))/2;
const pxy=(q,r)=>[HS*SQ*(q+r/2)+HS*SQ/2+6,HS*1.5*r+HS+6];
function hexPts(x,y,s){let p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p.push((x+s*Math.cos(a)).toFixed(1)+','+(y+s*Math.sin(a)).toFixed(1))}return p.join(' ')}
const B=()=>S.battle;
const U=id=>B().units.find(u=>u.id===id);
const live=u=>!u.dead&&!u.escaped;
const foesOf=u=>B().units.filter(x=>live(x)&&x.side!==u.side);
const alliesOf=u=>B().units.filter(x=>live(x)&&x.side===u.side&&x!==u);
const cellOf=u=>B().cmap[hk(u.q,u.r)];

function occSet(except){const s=new Set();B().units.forEach(u=>{if(live(u)&&u!==except)s.add(hk(u.q,u.r))});return s}
function zocSet(u){const s=new Set();foesOf(u).forEach(f=>{if(f.morale>0&&!WPN[f.weapon].ranged)DIRS.forEach(([dq,dr])=>s.add(hk(f.q+dq,f.r+dr)))});return s}
function reachable(u){
  const b=B(),st=moveFat(u);
  const maxS=Math.max(0,Math.min(Math.floor(u.ap/2),Math.floor((fatMaxEff(u)-u.fat)/st)));
  const start=hk(u.q,u.r),occ=occSet(u),zoc=u.morale>0?zocSet(u):new Set(),seen={[start]:{s:0,p:null}},fr=[[u.q,u.r,0]];
  while(fr.length){
    const [q,r,s]=fr.shift(),k=hk(q,r);
    if(s>=maxS)continue; if(k!==start&&zoc.has(k))continue;
    for(const [dq,dr] of DIRS){const nk=hk(q+dq,r+dr),c=b.cmap[nk];if(!c||c.t!=='g'||occ.has(nk)||seen[nk])continue;seen[nk]={s:s+1,p:k};fr.push([q+dq,r+dr,s+1]);}
  }
  delete seen[start];return seen;
}
function pathTo(reach,k){const a=[];while(k&&reach[k]){a.unshift(k);k=reach[k].p}return a}

/* ---------- Combat ---------- */
function canAttack(a,d){
  const w=WPN[a.weapon];if(!live(d)||d.side===a.side||a.morale===0)return false;
  const dd=hdist(a,d);return dd>=1&&dd<=w.rng&&a.ap>=w.ap&&a.fat+w.fat<=fatMaxEff(a);
}
function hitChance(a,d){
  const w=WPN[a.weapon],dd=hdist(a,d);let ch;
  if(w.ranged){
    const sh=(d.shield?25:0)+(d.sw?20:0);
    ch=a.rSk+w.hit-(d.rDef+sh+MDEF[d.morale])-3*Math.max(0,dd-2);if(dd===1)ch-=10;
  }else{
    const sh=(d.shield?15:0)+(d.sw?20:0);
    ch=a.mSk+w.hit-(d.mDef+sh+MDEF[d.morale]);
    ch+=5*B().units.filter(x=>x!==a&&x.side===a.side&&live(x)&&x.morale>0&&hdist(x,d)===1).length;
  }
  return clamp(Math.round(ch+MSK[a.morale]),5,95);
}
function log(t,c){const b=B();b.log.unshift({t,c:c||''});if(b.log.length>60)b.log.length=60;}
function fx(html){const g=$('#gFx');if(!g)return;const t=document.createElementNS('http://www.w3.org/2000/svg','g');t.innerHTML=html;g.appendChild(t);setTimeout(()=>t.remove(),1300)}
function float(u,txt,cls,dy){const [x,y]=pxy(u.q,u.r);fx(`<text class="flt ${cls}" x="${x}" y="${y-40+(dy||0)}">${esc(txt)}</text>`)}

function moraleDown(u,mod,why){
  if(!live(u)||u.morale===0)return;
  const ch=clamp(u.res+mod,5,95);
  if(R(1,100)>ch){u.morale--;log(`${u.name} ${why} : ${MORALE[u.morale].toLowerCase()}.`,'mor');float(u,MORALE[u.morale],'miss',-14);}
}
function moraleUp(u){if(!live(u)||u.morale===0||u.morale>=4)return;if(R(1,100)<=u.res-10){u.morale++;if(u.morale===4)log(`${u.name} est galvanisé.`,'mor');}}

async function doAttack(a,d,opt){
  opt=opt||{};const w=WPN[a.weapon];
  if(!opt.free){a.ap-=w.ap;a.fat+=w.fat;}
  const ch=hitChance(a,d),roll=R(1,100),hit=roll<=ch;
  const [x1,y10]=pxy(a.q,a.r),[x2,y2]=pxy(d.q,d.r),y1=y10-12;
  if(w.ranged)fx(`<line class="arrow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2-14}"/>`);
  else fx(`<line class="slash" x1="${x2-10}" y1="${y2-30}" x2="${x2+10}" y2="${y2+2}"/>`);
  await sleep(220);
  const tag=opt.free?' (attaque d\'opportunité)':'';
  if(!hit){float(d,'Raté','miss');log(`${a.name} manque ${d.name}${tag} — ${ch} %`,'miss');draw();await sleep(260);return{hit:false};}
  const head=Math.random()<.25;let raw=R(w.min,w.max)*(head?1.5:1);
  const slot=head?'armH':'armB',arm=d[slot];let hpD,armD;
  if(arm<=0){hpD=raw;armD=0}
  else{
    const ad=raw*w.arm;armD=Math.min(arm,ad);hpD=Math.max(0,raw*w.ign-arm*.1);
    if(ad>arm)hpD+=(ad-arm)/w.arm*(1-w.ign);
  }
  hpD=Math.round(hpD);armD=Math.round(armD);
  d[slot]=Math.max(0,arm-armD);d.hp-=hpD;
  if(armD)float(d,'−'+armD,'ar',-14);
  float(d,(head?'Tête ! ':'')+'−'+hpD,'hp'+(head?' big':''));
  log(`${a.name} touche ${d.name}${head?' à la tête':''}${tag} : ${hpD} PV, ${armD} armure — ${ch} %`,'hit');
  if(d.hp<=0){kill(d,a);}
  else if(hpD>=12){moraleDown(d,d.hp<d.hpMax*.4?-15:10,'flanche sous le coup');}
  draw();await sleep(300);
  return{hit:true};
}
function kill(d,a){
  d.hp=0;d.dead=true;d.sw=false;B().dead.push({q:d.q,r:d.r});
  log(`${d.name} tombe sous les coups de ${a.name}.`,'death');
  a.kills++;if(a.side==='p'){B().xp[a.id]=(B().xp[a.id]||0)+(d.xpv||15);}
  B().units.forEach(x=>{
    if(!live(x))return;
    if(x.side===d.side&&hdist(x,d)<=4)moraleDown(x,d.leader?-15:0,d.leader?'voit son chef tomber':'voit tomber '+d.name.split(' ')[0]);
    else if(x.side!==d.side&&hdist(x,d)<=4)moraleUp(x);
  });
  if(d.leader)B().units.forEach(x=>{if(live(x)&&x.side===d.side&&hdist(x,d)>4)moraleDown(x,-10,'perd son chef');});
}
async function moveAlong(u,path){
  if(!path.length)return;
  if(u.morale>=0){
    const zoc=foesOf(u).filter(f=>f.morale>0&&!WPN[f.weapon].ranged&&hdist(f,u)===1);
    for(const f of zoc){const r=await doAttack(f,u,{free:true});if(u.dead)return;if(r.hit){log(`${u.name} est retenu.`,'miss');return;}}
  }
  const st=moveFat(u);
  for(const k of path){const c=B().cmap[k];u.q=c.q;u.r=c.r;u.ap-=2;u.fat+=st;draw();await sleep(140);}
}

/* ---------- Déroulement ---------- */
function startBattle(i){
  const c=S.contracts[i],W=12,H=9,cells=[],cmap={};
  for(let r=0;r<H;r++)for(let col=0;col<W;col++){
    const q=col-(r>>1);let t='g';
    if(col>=3&&col<=W-4&&Math.random()<.13)t=Math.random()<.6?'tree':'rock';
    const cell={q,r,c:col,t,v:R(0,2)};cells.push(cell);cmap[hk(q,r)]=cell;
  }
  const party=S.roster.slice(0,8).map(m=>JSON.parse(JSON.stringify(m)));
  const foes=c.foes.map(mkFoe);
  const rows=[4,3,5,2,6,1,7,0,8];
  function deploy(list,colM,colR){
    const mel=list.filter(u=>!WPN[u.weapon].ranged),rng=list.filter(u=>WPN[u.weapon].ranged);
    const slotsM=rows.map(r=>[colM,r]).concat(rows.map(r=>[colR,r]).reverse());
    const slotsR=rows.map(r=>[colR,r]).concat(rows.map(r=>[colM,r]).reverse());
    const used=new Set();
    const place=(u,slots)=>{for(const [col,r] of slots){const k=col+':'+r;if(used.has(k))continue;used.add(k);u.r=r;u.q=col-(r>>1);cmap[hk(u.q,u.r)].t='g';return;}};
    mel.forEach(u=>place(u,slotsM));rng.forEach(u=>place(u,slotsR));
  }
  deploy(party,1,0);deploy(foes,W-2,W-1);
  [...party,...foes].forEach(u=>Object.assign(u,{ap:9,fat:0,morale:3,dead:false,escaped:false,sw:false,turnRound:0}));
  S.battle={id:UID++,W,H,cells,cmap,units:[...party,...foes],queue:[],round:0,cur:null,log:[],ci:i,contract:c,xp:{},busy:false,over:null,reach:{},hover:null,pending:null,inspect:null,dead:[],confirmRetreat:false};
  log(c.title,'sys');
  newRound();render();runTurns();
}
function newRound(){
  const b=B();b.round++;
  b.queue=b.units.filter(live).sort((a,c)=>iniEff(c)-iniEff(a)).map(u=>u.id);
  b.units.forEach(u=>u.waited=false);
  if(b.round>1)log('Manche '+b.round,'sys');
}
function startTurn(u){if(u.turnRound===B().round)return;u.turnRound=B().round;u.ap=9;u.fat=Math.max(0,u.fat-15);u.sw=false;}
function checkEnd(){
  const b=B();if(b.over)return true;
  const act=s=>b.units.filter(u=>u.side===s&&live(u)&&u.morale>0).length;
  if(!act('e')){endBattle('win');return true}
  if(!act('p')){endBattle('lose');return true}
  return false;
}
function endBattle(res){
  const b=B();b.over=res;b.busy=false;b.cur=null;
  if(res==='win'){b.units.filter(u=>u.side==='e'&&live(u)).forEach(u=>u.escaped=true);log('Victoire. Le champ est à vous.','sys');}
  else log(res==='retreat'?'La compagnie bat en retraite.':'Défaite. Les survivants se dispersent.','sys');
  save();render();
}
async function runTurns(){
  const b=B();
  while(true){
    if(!S.battle||S.battle!==b)return;
    if(checkEnd())return;
    if(!b.queue.length)newRound();
    const u=U(b.queue.shift());if(!u||!live(u))continue;
    b.cur=u.id;startTurn(u);b.pending=null;b.hover=null;
    if(u.morale===0){
      const adj=foesOf(u).filter(f=>hdist(f,u)===1).length;
      if(R(1,100)<=clamp(u.res-10*adj,5,90)){u.morale=1;log(`${u.name} se ressaisit.`,'mor');}
    }
    if(u.morale===0){b.busy=true;render();await sleep(300);await fleeAct(u);b.cur=null;continue;}
    if(u.side==='e'){b.busy=true;render();await sleep(250);await aiAct(u);b.cur=null;continue;}
    b.busy=false;b.reach=reachable(u);render();save();return;
  }
}
function afterPlayerAction(){
  const b=B(),u=U(b.cur);
  if(checkEnd())return;
  if(!u||!live(u)||u.morale===0){b.cur=null;runTurns();return;}
  b.reach=reachable(u);b.pending=null;
  const w=WPN[u.weapon];
  const canDo=Object.keys(b.reach).length||foesOf(u).some(f=>canAttack(u,f))||(u.shield&&!u.sw&&u.ap>=4);
  if(!canDo){b.cur=null;runTurns();return;}
  b.busy=false;render();save();
}
async function playerMove(k){
  const b=B(),u=U(b.cur);b.busy=true;b.hover=null;render();
  await moveAlong(u,pathTo(b.reach,k));afterPlayerAction();
}
async function playerAttack(t){
  const b=B(),u=U(b.cur);b.busy=true;b.inspect=t.id;render();
  await doAttack(u,t);afterPlayerAction();
}

/* ---------- IA ---------- */
function evalPos(u,q,r){
  const w=WPN[u.weapon],fs=foesOf(u);if(!fs.length)return 0;
  let md=99;fs.forEach(f=>{md=Math.min(md,hdist({q,r},f))});
  if(w.ranged){return (md<=w.rng?50:0)-Math.abs(md-4)*3-(md===1?40:0);}
  const adjAllies=alliesOf(u).filter(a=>hdist({q,r},a)===1).length;
  return (md<=w.rng?60:0)-Math.max(0,md-w.rng)*10+adjAllies;
}
function targetScore(u,f){const hc=hitChance(u,f);return hc*(1.6-f.hp/f.hpMax)+(f.morale===0?10:0)+(u.fac==='g'?(1-f.hp/f.hpMax)*40:0);}
async function aiAct(u){
  let attacked=false,moved=false;
  for(let g=0;g<5;g++){
    if(!live(u)||B().over)return;
    const tg=foesOf(u).filter(f=>canAttack(u,f));
    if(tg.length){tg.sort((a,c)=>targetScore(u,c)-targetScore(u,a));await doAttack(u,tg[0]);attacked=true;if(checkEnd())return;continue;}
    if(attacked||moved)break;
    const reach=reachable(u);let best=null,bs=evalPos(u,u.q,u.r);
    for(const k in reach){const c=B().cmap[k];const s=evalPos(u,c.q,c.r)-reach[k].s*.3;if(s>bs){bs=s;best=k;}}
    if(!best)break;
    await moveAlong(u,pathTo(reach,best));moved=true;if(checkEnd())return;
  }
  if(live(u)&&u.shield&&!u.sw&&u.ap>=4&&foesOf(u).some(f=>hdist(f,u)<=2)){u.sw=true;u.ap-=4;log(`${u.name} lève son bouclier.`,'miss');draw();await sleep(200);}
}
async function fleeAct(u){
  const b=B(),edge=u.side==='p'?0:b.W-1;
  if(cellOf(u).c===edge){u.escaped=true;log(`${u.name} quitte le champ de bataille.`,'mor');render();await sleep(250);return;}
  const reach=reachable(u);let best=null,bs=-1e9;
  const sc=(q,r)=>{const c=b.cmap[hk(q,r)];let md=99;foesOf(u).forEach(f=>md=Math.min(md,hdist({q,r},f)));return -Math.abs(c.c-edge)*3+Math.min(md,6)*2;};
  bs=sc(u.q,u.r);for(const k in reach){const c=b.cmap[k];const s=sc(c.q,c.r);if(s>bs){bs=s;best=k}}
  log(`${u.name} prend la fuite !`,'mor');
  if(best)await moveAlong(u,pathTo(reach,best));
  if(live(u)&&cellOf(u).c===edge){u.escaped=true;log(`${u.name} quitte le champ de bataille.`,'mor');}
  draw();await sleep(200);
}

/* ---------- Retour au camp ---------- */
function applyResults(){
  const b=B(),c=b.contract,win=b.over==='win';
  const byId={};b.units.filter(u=>u.side==='p').forEach(u=>byId[u.id]=u);
  const dead=[];
  S.roster=S.roster.filter(m=>{
    const bu=byId[m.id];if(!bu)return true;
    if(bu.dead){dead.push(m.name);S.fallen.push({name:m.name,bg:m.bg,lvl:m.lvl,kills:bu.kills,day:S.day});return false;}
    m.hp=Math.max(1,bu.hp);m.armH=bu.armH;m.armB=bu.armB;m.kills=bu.kills;
    m.xp+=(b.xp[m.id]||0)+(win?15*c.d:5);
    m.hp=Math.min(m.hpMax,m.hp+8*c.days);levelCheck(m);return true;
  });
  const wg=wages()*c.days;
  let msg=[];
  if(win){S.gold+=c.pay;S.renown+=40*c.d;msg.push(`Contrat rempli : +${c.pay} couronnes, +${40*c.d} renom.`);}
  else{S.renown=Math.max(0,S.renown-15);msg.push(b.over==='retreat'?'Retraite. Le contrat est perdu.':'Défaite. Le contrat est perdu.');}
  if(dead.length)msg.push('Tombés : '+dead.join(', ')+'.');
  S.gold-=wg;msg.push(`Solde versée pour ${c.days} jour${c.days>1?'s':''} : −${wg}.`);
  if(S.gold<0&&S.roster.length){const m=pick(S.roster);S.roster=S.roster.filter(x=>x!==m);msg.push(`Faute de paie, ${m.name} déserte.`);S.gold=0;}
  S.day+=c.days;S.battle=null;news(...msg);genContracts();genRecruits();
  if(!S.roster.length)S.over=true;
  S.tab='company';save();render();
}

/* ---------- Rendu : commun ---------- */

function gearList(u){const w=WPN[u.weapon];return `<div class="gear">

function header(){
  const inB=!!S.battle;

}
function render(){
  const app=$('#app');
  if(!S.battle){app.innerHTML=header()+(S.over?overHTML():campHTML())+promoHTML();return;}
  const b=B();

  $('#bhead').innerHTML=`<h2>${esc(b.contract.title)}</h2><span class="sub">Manche ${b.round} · ${'Danger '+b.contract.d+'/3'} · Prime ${b.contract.pay} couronnes</span>`;

function campHTML(){
  const tabs=[['company','Compagnie'],['contracts','Contrats'],['recruit','Recruter'],['market','Marché']];
  let h=`<div class="news">${S.news.map(n=>`<div>${esc(n)}</div>`).join('')}</div>

/* ---------- Évènements ---------- */
document.addEventListener('pointerdown',e=>{lastPtr=e.pointerType||'mouse'},true);
document.addEventListener('change',e=>{if(e.target.id==='msel'){S.mSel=+e.target.value;render();}});
document.addEventListener('click',e=>{
  const svg=e.target.closest('#svg');if(svg){boardClick(e);return;}
  const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a!=='new'&&a!=='dis')S.confirm=null;
  const b=S.battle;
  switch(a){
    case 'tab':S.tab=v;break;
    case 'new':S.confirm='new';break;
    case 'newgo':try{localStorage.removeItem(KEY)}catch(x){}newGame();return;
    case 'cancel':break;
    case 'rest':S.day++;S.gold-=wages();S.roster.forEach(m=>m.hp=Math.min(m.hpMax,m.hp+15));news(`Un jour de repos. −${wages()} couronnes de solde.`);if(S.gold<0){const m=pick(S.roster);S.roster=S.roster.filter(x=>x!==m);news(`Faute de paie, ${m.name} déserte.`);S.gold=0;if(!S.roster.length)S.over=true;}break;
    case 'repair':{const c=repairCost();S.gold-=c;S.roster.forEach(m=>{m.armH=HEAD[m.head].a;m.armB=BODY[m.body].a});news(`Armures réparées pour ${c} couronnes.`);break;}
    case 'up':{const i=S.roster.findIndex(m=>m.id==v);if(i>0)[S.roster[i-1],S.roster[i]]=[S.roster[i],S.roster[i-1]];break;}
    case 'dis':S.confirm='dis'+v;break;
    case 'disgo':{const m=S.roster.find(x=>x.id==v);S.roster=S.roster.filter(x=>x.id!=v);news(`${m.name} quitte la compagnie.`);break;}
    case 'accept':save();startBattle(+v);return;
    case 'hire':{const r=S.recruits[+v];if(S.gold>=r.price&&S.roster.length<10){S.gold-=r.price;S.roster.push(r.u);S.recruits.splice(+v,1);news(`${r.u.name} rejoint la compagnie.`);}break;}
    case 'bw':case 'bs':case 'bh':case 'bb':buy(a,v);break;
    case 'promo':{const m=S.roster.find(x=>x.id==v);const rolls={};Object.keys(PROMO).forEach(k=>rolls[k]=R(...PROMO[k]));S.promo={id:m.id,rolls,chosen:[]};break;}
    case 'pick':{const p=S.promo,i=p.chosen.indexOf(v);if(i>=0)p.chosen.splice(i,1);else if(p.chosen.length<3)p.chosen.push(v);break;}
    case 'promogo':{const p=S.promo,m=S.roster.find(x=>x.id===p.id);p.chosen.forEach(k=>{m[k]+=p.rolls[k];if(k==='hpMax')m.hp+=p.rolls[k];});m.pending--;S.promo=null;news(`${m.name} gagne en expérience.`);break;}
    case 'promox':S.promo=null;break;
    // bataille
    case 'sw':{const u=U(b.cur);u.sw=true;u.ap-=4;u.fat+=10;log(`${u.name} forme un mur de boucliers.`,'miss');afterPlayerAction();return;}
    case 'wait':{const u=U(b.cur);u.waited=true;b.queue.push(u.id);b.cur=null;runTurns();return;}
    case 'end':b.cur=null;runTurns();return;
    case 'retreat':b.confirmRetreat=true;draw();return;
    case 'retreatx':b.confirmRetreat=false;draw();return;
    case 'retreatgo':endBattle('retreat');return;
    case 'return':applyResults();return;
  }
  save();render();
});
function buy(a,v){
  const m=S.roster.find(x=>x.id===S.mSel);
  if(a==='bw'){const w=WPN[v];if(S.gold<w.price)return;S.gold-=w.price;m.weapon=v;if(!w.h1&&m.shield){m.shield=false;}news(`${m.name} s'équipe : ${w.n}.`);}
  if(a==='bs'){if(S.gold<SHIELD.price||!WPN[m.weapon].h1)return;S.gold-=SHIELD.price;m.shield=true;news(`${m.name} s'équipe : ${SHIELD.n}.`);}
  if(a==='bh'){const h=HEAD[v];if(S.gold<h.price)return;S.gold-=h.price;m.head=v;m.armH=h.a;news(`${m.name} s'équipe : ${h.n}.`);}
  if(a==='bb'){const h=BODY[v];if(S.gold<h.price)return;S.gold-=h.price;m.body=v;m.armB=h.a;news(`${m.name} s'équipe : ${h.n}.`);}
}
function boardClick(e){
  const b=B();if(!b||b.over)return;
  const ue=e.target.closest('[data-u]'),he=e.target.closest('[data-k]');
  const cur=U(b.cur),pl=cur&&cur.side==='p'&&!b.busy,touch=lastPtr==='touch';
  if(ue){
    const t=U(+ue.dataset.u);b.inspect=t.id;
    if(pl&&t.side!=='p'&&canAttack(cur,t)){
      if(touch&&b.pending!=='u'+t.id){b.pending='u'+t.id;draw();return;}
      b.pending=null;playerAttack(t);return;
    }
    b.pending=null;draw();return;
  }
  if(he&&pl){
    const k=he.dataset.k;
    if(b.reach[k]){
      if(touch&&b.pending!==k){b.pending=k;draw();return;}
      b.pending=null;playerMove(k);return;
    }
    b.pending=null;draw();
  }
}
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;const b=S&&S.battle;if(!b||b.busy||b.over)return;
  if(!e.target.closest||!e.target.closest('#svg'))return;
  const ue=e.target.closest('[data-u]'),he=e.target.closest('[data-k]');
  const k=he?he.dataset.k:null;let ch=false;
  if(k!==b.hover){b.hover=k;ch=true;}
  if(ue&&+ue.dataset.u!==b.inspect){b.inspect=+ue.dataset.u;ch=true;}
  if(ch)draw();
});

/* ---------- Démarrage ---------- */
if(load()){
  S.promo=null;S.confirm=null;
  if(S.battle){const b=S.battle;
    if(b.over)render();
    else{b.busy=false;const u=U(b.cur);
      if(u&&u.side==='p'&&live(u)&&u.morale>0){b.reach=reachable(u);render();}
      else{if(u&&live(u))b.queue.unshift(u.id);b.cur=null;render();runTurns();}}
  }else render();
}else newGame();
})();
</script>
